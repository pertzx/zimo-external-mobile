plugins {
    id 'com.android.application'
}

android {
    namespace 'com.stormcheats'
    compileSdk 34

    ndkVersion "25.1.8937393"  // <-- ADICIONAR ISTO

    defaultConfig {
        applicationId "com.stormcheats"
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName "1.0"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -O2"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            jniDebuggable true
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17  // <-- ATUALIZAR
        targetCompatibility JavaVersion.VERSION_17  // <-- ATUALIZAR
    }
}

dependencies {
    implementation 'androidx.core:core:1.12.0'
}